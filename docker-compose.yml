version: "3.8"

services:
  neo4j:
    image: neo4j:5.13-community
    container_name: chemextract-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/chemextract123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 512m
      NEO4J_dbms_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    container_name: chemextract-app
    network_mode: host
    environment:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: chemextract123
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OBSIDIAN_VAULT_PATH: /vault
    env_file:
      - .env
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
      - ${OBSIDIAN_VAULT_PATH:-./data/obsidian_vault}:/vault
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
